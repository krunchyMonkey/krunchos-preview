name: Deploy KrunchOS preview

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full 40-character SHA of a reviewed commit on krunchyMonkey/krunchymonkey-site main
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify pinned source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify source commit is merged to main
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_commit must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi
          curl --fail --silent --show-error \
            "https://api.github.com/repos/krunchyMonkey/krunchymonkey-site/compare/${SOURCE_COMMIT}...main" \
            --output "$RUNNER_TEMP/source-compare.json"
          status="$(jq -r '.status' "$RUNNER_TEMP/source-compare.json")"
          if [[ "$status" != "ahead" && "$status" != "identical" ]]; then
            echo "Source commit is not an ancestor of krunchyMonkey/krunchymonkey-site main (compare status: $status)" >&2
            exit 1
          fi
      - name: Check out the exact source commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: krunchyMonkey/krunchymonkey-site
          ref: ${{ inputs.source_commit }}
          path: source
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: source/krunchos/package-lock.json
      - name: Install locked dependencies
        working-directory: source/krunchos
        run: npm ci --no-audit --no-fund
      - name: Run source verification and build
        working-directory: source/krunchos
        run: npm run check
      - name: Generate the static artifact privacy report
        working-directory: source/krunchos
        run: npm run check:dist -- --json "$RUNNER_TEMP/krunchos-dist-manifest.json"
      - name: Stage only the KrunchOS static site
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test -s source/krunchos/dist/index.html || { echo "Expected krunchos/dist/index.html is missing or empty" >&2; exit 1; }
          if find source/krunchos/dist -type l -print -quit | grep -q .; then
            echo "Symlinks are not allowed in the static build" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/krunchos-site/os" "$RUNNER_TEMP/krunchos-provenance"
          cp -a source/krunchos/dist/. "$RUNNER_TEMP/krunchos-site/os/"
          test -s "$RUNNER_TEMP/krunchos-site/os/index.html" || { echo "Expected /os/ entry point is missing or empty" >&2; exit 1; }
          printf '%s\n' "$SOURCE_COMMIT" > "$RUNNER_TEMP/krunchos-provenance/source-commit.txt"
          (cd "$RUNNER_TEMP/krunchos-site" && find os -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/krunchos-provenance/manifest.txt"
          manifest_sha="$(sha256sum "$RUNNER_TEMP/krunchos-provenance/manifest.txt" | cut -d ' ' -f 1)"
          {
            echo "### KrunchOS static build verified"
            echo "- Source repository: \`krunchyMonkey/krunchymonkey-site\`"
            echo "- Source commit: \`$SOURCE_COMMIT\`"
            echo "- Published prefix: \`/os/\`"
            echo "- File manifest SHA-256: \`$manifest_sha\`"
            echo "- Source privacy/build gate: \`npm run check\` and \`npm run check:dist\` passed"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload verified Pages files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krunchos-pages
          path: ${{ runner.temp }}/krunchos-site/
          if-no-files-found: error
          retention-days: 1
      - name: Upload build provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: krunchos-provenance
          path: ${{ runner.temp }}/krunchos-provenance/
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: Publish verified artifact to Pages
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download verified Pages files
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: krunchos-pages
          path: _site
      - name: Download build provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: krunchos-provenance
          path: ${{ runner.temp }}/krunchos-provenance
      - name: Verify artifact and /os/ entry point
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          test -s _site/os/index.html || { echo "Expected _site/os/index.html is missing or empty" >&2; exit 1; }
          test "$(cat "$RUNNER_TEMP/krunchos-provenance/source-commit.txt")" = "$SOURCE_COMMIT" || { echo "Artifact source commit does not match the requested commit" >&2; exit 1; }
          if find _site -type l -print -quit | grep -q .; then
            echo "Symlinks are not allowed in the Pages artifact" >&2
            exit 1
          fi
          (cd _site && find os -type f -print0 | sort -z | xargs -0 sha256sum) > "$RUNNER_TEMP/actual-manifest.txt"
          diff -u "$RUNNER_TEMP/krunchos-provenance/manifest.txt" "$RUNNER_TEMP/actual-manifest.txt"
          if find _site -mindepth 1 -maxdepth 1 ! -name os -print -quit | grep -q .; then
            echo "Only the /os/ static site is allowed in the Pages artifact" >&2
            exit 1
          fi
          echo "The downloaded artifact matches the source commit and complete SHA-256 manifest." >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
